[package]
name = "linttrap"
version = "0.1.0"
edition = "2024"
description = "Disk space treemap and junk cleaner for Windows"
license = "MIT"
repository = "https://github.com/MattGyverLee/LintTrap"

[dependencies]
eframe = "0.37.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_Devices","Win32_Devices_DeviceAndDriverInstallation","Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
